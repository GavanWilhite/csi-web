# ---------------------------------------------------------------------------
# Supply-chain policy
#
# Declared here so it travels with the repo — to CI, and to any machine that
# lacks the developer's global config. pnpm 10.x also honours these in
# .npmrc (kebab-case), but a global file protects one laptop; this protects
# the build.
#
# Casing is format-specific and fails SILENTLY if wrong:
#   pnpm-workspace.yaml -> camelCase   (minimumReleaseAge)
#   .npmrc / pnpm rc    -> kebab-case  (minimum-release-age)
# A mismatch is not warned about — it just resolves as if unset. pnpm also
# does not validate trustPolicy's enum, so a typo there fails open too.
# Verify behaviour, never assume: install a package with a release inside the
# cooldown and confirm it resolves to the older version.
# ---------------------------------------------------------------------------

# 10080 minutes = 7 days, matching `minimum-release-age` in ~/.npmrc.
# Most malicious publishes are caught and yanked within hours, so a 7-day
# cooldown means we never install a version fresh enough to be in that window.
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Fail the install if a package's publish trust level drops below what earlier
# versions had (a common signature of maintainer-account takeover).
# This is pnpm's default; declared explicitly so it can't be lost silently.
trustPolicy: no-downgrade

# No exceptions. The eslint-config-next chain pulled several pre-provenance
# transitive deps that tripped this check; rather than allowlist unaudited
# packages, the optional lint toolchain was removed. Keep this list empty.
trustPolicyExclude: []

# pnpm 10+ does not run dependency lifecycle scripts unless allowlisted here.
# Empty = nothing may run install/postinstall scripts.
onlyBuiltDependencies: []
